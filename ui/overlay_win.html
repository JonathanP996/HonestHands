<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The Windows warning card. Same design as the Mac one: top-right, red-edged glass card, a red alert badge with ripples,
     the details unfold after a beat, lime "Edit my message", red "Send it now". */
  :root{ --ink:#F3F1EA; --muted:rgba(243,241,234,.62); --faint:rgba(243,241,234,.4); --card:rgba(27,36,33,.95);
         --line:rgba(243,241,234,.10); --accent:#E65C57; --lime:#A9B620; --btn:rgba(243,241,234,.09); --btn-h:rgba(243,241,234,.16); }
  @media (prefers-color-scheme: light){
    :root{ --ink:#1C2420; --muted:rgba(28,36,32,.62); --faint:rgba(28,36,32,.42); --card:rgba(255,253,249,.96);
           --line:rgba(28,36,32,.10); --btn:rgba(28,36,32,.07); --btn-h:rgba(28,36,32,.13); }
  }
  *{margin:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{background:transparent;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #root{position:absolute;top:0;right:0;width:100%;padding:12px 14px 22px 14px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}

  .card{width:396px;background:var(--card);border-radius:24px;padding:18px;position:relative;
    box-shadow:0 18px 40px -8px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25);
    transform:translateX(120%);opacity:0;transition:transform .55s cubic-bezier(.17,.84,.26,1),opacity .35s ease}
  .card::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(230,92,87,.6),var(--line) 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .card.in{transform:none;opacity:1}
  .card.out{transform:translateX(120%);opacity:0}
  .head{display:flex;align-items:center;gap:12px}
  .badge{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(230,92,87,.2);display:grid;place-items:center;flex:none}
  .badge svg{width:17px;height:17px;color:var(--accent);animation:bounce .7s .1s cubic-bezier(.3,1.6,.4,1) both}
  .badge i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(230,92,87,.55);opacity:0;animation:ripple 1.5s ease-out 2}
  .badge i:nth-child(2){animation-delay:.28s}.badge i:nth-child(3){animation-delay:.56s}
  @keyframes ripple{0%{transform:scale(.9);opacity:.6}100%{transform:scale(2.6);opacity:0}}
  @keyframes bounce{from{transform:scale(.3) rotate(-25deg)}}
  .head h1{font-size:16px;font-weight:600;line-height:1.2}
  .head .ctx{font-size:11.5px;color:var(--muted);margin-top:1px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .body{max-height:0;opacity:0;overflow:hidden;transition:max-height .6s cubic-bezier(.2,.9,.25,1),opacity .35s ease .05s}
  .card.open .body{max-height:520px;opacity:1}
  .inner{padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .r{opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
  .card.open .r{opacity:1;transform:none}
  .r1{transition-delay:.05s}.r2{transition-delay:.1s}.r3{transition-delay:.15s}.r4{transition-delay:.2s}.r5{transition-delay:.25s}.r6{transition-delay:.3s}
  .why{font-size:13.5px;line-height:1.5}
  .rule{font-size:12.5px;line-height:1.45}.rule b{color:var(--muted);font-weight:600;margin-right:6px}
  .quote{display:flex;gap:9px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12.5px;color:var(--muted);line-height:1.45}
  .quote::before{content:"";width:3px;border-radius:2px;background:rgba(230,92,87,.7);flex:none}
  .tip{display:flex;gap:7px;font-size:12.5px;line-height:1.45;color:var(--accent)}
  .tip svg{width:12px;height:12px;margin-top:3px;flex:none}
  .src{font-size:10.5px;color:var(--faint)}
  .btns{display:flex;gap:8px;margin-top:4px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:9px 10px;font:600 13px/1.2 inherit;
    font-family:inherit;color:var(--ink);background:var(--btn);cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.4,1),background .2s}
  .btn:hover{transform:scale(1.03);background:var(--btn-h)}.btn:active{transform:scale(.97)}
  .btn small{font-size:11px;font-weight:500;opacity:.55}
  .btn.primary{background:var(--lime);color:rgba(0,0,0,.85)}.btn.primary:hover{background:#b9c62a}
  .btn.danger{background:var(--accent);color:#fff}.btn.danger:hover{background:#ec6b66}
  .note{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--faint)}.note svg{width:11px;height:11px}

  .pill{display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--card);
    box-shadow:0 10px 24px -6px rgba(0,0,0,.4);position:relative;transform:translateX(130%);opacity:0;transition:transform .5s cubic-bezier(.17,.84,.26,1),opacity .3s}
  .pill.in{transform:none;opacity:1}.pill.out{transform:translateX(130%);opacity:0}
  .pill::before{content:"";position:absolute;inset:0;border-radius:999px;border:1px solid var(--line);pointer-events:none}
  .pill.good::before{border-color:rgba(169,182,32,.55)}
  .spin{width:14px;height:14px;border:2px solid var(--muted);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pill svg{width:16px;height:16px;color:var(--lime)}
  @media (prefers-reduced-motion:reduce){.card,.pill,.body,.r{transition:none}.badge i,.badge svg{animation:none}}
</style>
</head>
<body>
<div id="root">
  <div class="pill" id="p-check"><span class="spin"></span>Checking with your professor…</div>
  <div class="pill good" id="p-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" fill="currentColor" fill-opacity=".18"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>You’re good, sending it</div>
  <div class="card" id="card"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const TRI = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6c.7 0 1.3.4 1.7 1l8.3 14.2c.8 1.3-.2 3-1.7 3H3.7c-1.5 0-2.5-1.7-1.7-3L10.3 3.6c.4-.6 1-1 1.7-1zm0 6.2c-.5 0-.9.4-.9.9v4.4c0 .5.4.9.9.9s.9-.4.9-.9V9.7c0-.5-.4-.9-.9-.9zm0 8.5a1.15 1.15 0 100-2.3 1.15 1.15 0 000 2.3z"/></svg>';
const BULB = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-4 12.7V17a1 1 0 001 1h6a1 1 0 001-1v-2.3A7 7 0 0012 2zm-2 18h4v1a2 2 0 01-4 0z"/></svg>';
const DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><circle cx="12" cy="14" r="3"/><path d="M14.2 16.2L17 19"/></svg>';
let cur = null, timer = null;

function fit() {                                         // tell the window how tall the content is, so it never blocks clicks beyond the card
  const root = $('root');
  try { window.pywebview.api.resize(Math.ceil(root.getBoundingClientRect().height)); } catch (e) {}
}
new ResizeObserver(fit).observe(document.getElementById('root'));

function hideAll() {
  clearTimeout(timer);
  ['p-check', 'p-ok'].forEach(i => $(i).classList.remove('in'));
  $('card').classList.remove('in', 'open'); cur = null;
}
function showChecking() {
  hideAll(); $('p-check').classList.add('in');
}
function showOk() {
  $('p-check').classList.remove('in'); $('p-ok').classList.add('in');
  timer = setTimeout(() => { $('p-ok').classList.remove('in'); setTimeout(() => { try { window.pywebview.api.done(); } catch (e) {} }, 520); }, 1400);
}
function showBlock(p) {
  hideAll(); cur = p;
  const hard = !!p.hard, allow = p.allowSend !== undefined ? !!p.allowSend : !hard;
  const card = $('card');
  card.innerHTML = `
    <div class="head"><div class="badge"><i></i><i></i><i></i>${TRI}</div>
      <div><h1>${esc(p.title || (hard ? 'Message blocked' : 'Hold on a second'))}</h1><div class="ctx">${esc(p.context || '')}</div></div></div>
    <div class="body"><div class="inner">
      <div class="why r r1">${esc(p.reason)}</div>
      ${p.rule ? `<div class="rule r r2"><b>Rule</b>${esc(p.rule)}</div>` : ''}
      ${p.quote ? `<div class="quote r r3"><span>“${esc(p.quote)}”</span></div>` : ''}
      ${p.tip ? `<div class="tip r r4">${BULB}<span>${esc(p.tip)}</span></div>` : ''}
      <div class="src r r5">Checked by the ${esc(p.source || 'guard')}</div>
      <div class="r r6">
        <div class="btns">
          <button class="btn primary" onclick="choose('edit')">${esc(p.okLabel || (hard ? 'OK, I’ll edit it' : 'Edit my message'))}<small>↩</small></button>
          ${allow ? `<button class="btn danger" onclick="choose('send_anyway')">Send it now<small>Ctrl ↩</small></button>` : ''}
        </div>
        ${allow ? `<div class="note" style="margin-top:8px">${DOC}<span>${esc(p.note || 'Sending it now is recorded in your activity log.')}</span></div>` : ''}
      </div>
    </div></div>`;
  void card.offsetWidth;
  card.classList.add('in');
  setTimeout(() => card.classList.add('open'), 280);      // the card arrives small, then unfolds
}
function choose(c) {
  $('card').classList.remove('in'); $('card').classList.add('out');
  setTimeout(() => { try { window.pywebview.api.choose(c); } catch (e) {} }, 320);
}
window.addEventListener('keydown', e => {
  if (!cur) return;
  if (e.key === 'Escape') choose('edit');
  else if (e.key === 'Enter') choose(e.ctrlKey && (cur.allowSend ?? !cur.hard) ? 'send_anyway' : 'edit');
});
</script>
</body>
</html>
